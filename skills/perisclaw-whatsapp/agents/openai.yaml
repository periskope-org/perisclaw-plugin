interface:
  display_name: 'Perisclaw WhatsApp'
  short_description: 'Use WhatsApp safely through Perisclaw'
  default_prompt: 'Use $perisclaw-whatsapp to summarize my unread WhatsApp chats.'

dependencies:
  tools:
    - type: 'mcp'
      value: 'perisclaw'
      description: "Perisclaw's authenticated WhatsApp MCP server"
      transport: 'streamable_http'
      url: 'https://api.perisclaw.com/mcp/plugin'
